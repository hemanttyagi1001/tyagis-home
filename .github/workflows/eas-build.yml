name: Verify & Release

# Local development uses `npx expo start` with Expo Go, so pull requests do not
# build on EAS - they only verify that the code installs, configures and
# bundles. Merging to main is what produces a release.
#
#   pull request  -> verify only (~2 min, no EAS queue)
#   merge to main -> production AAB -> Play Store internal track (draft)
#   manual        -> choose a profile, and whether to submit
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/CODEOWNERS'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/CODEOWNERS'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        type: choice
        options: [preview, production]
        default: preview
      submit:
        description: 'Submit to Play Store after building (production only)'
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPO_NO_TELEMETRY: 1

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a run on main mid-submit; superseding a PR check is fine.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Expo config
        run: npx expo config --type public --json > /dev/null

      - name: Bundle for Android
        # Exercises every source file through Metro, so a syntax error or bad
        # import fails here rather than in a release build.
        run: |
          npx expo export --platform android --output-dir /tmp/expo-export
          echo "Bundle produced:"
          du -sh /tmp/expo-export

  release:
    name: Build & Submit
    needs: verify
    runs-on: ubuntu-latest
    # Only merges into main, or an explicit manual run. Pull requests stop at
    # verify so local Expo Go testing is the fast path.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Resolve build profile
        id: profile
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.profile }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=production" >> "$GITHUB_OUTPUT"
          fi

      - name: Build on EAS
        # --wait so submission runs against a finished artifact rather than
        # racing a build that is still queued.
        run: |
          eas build \
            --platform android \
            --profile ${{ steps.profile.outputs.name }} \
            --non-interactive \
            --wait

      # --- Play Store submission -------------------------------------------
      # Gated on the PLAY_SUBMIT_ENABLED repository variable. Google's API
      # cannot create a release for an app that has never had a manual upload,
      # so submission stays off until the first AAB has been uploaded by hand.
      # Turn it on with:
      #   gh variable set PLAY_SUBMIT_ENABLED --body true
      - name: Check submission gate
        id: gate
        run: |
          if [ "${{ vars.PLAY_SUBMIT_ENABLED }}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Play Store submission is disabled. Download the AAB from EAS and upload it manually, then set the PLAY_SUBMIT_ENABLED variable to true."
          fi

      # The service account key is written from a secret at runtime and removed
      # immediately afterwards. It is gitignored and never committed.
      - name: Write Play Store service account key
        if: |
          steps.gate.outputs.enabled == 'true' &&
          steps.profile.outputs.name == 'production' &&
          (github.event_name == 'push' || inputs.submit)
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}" ]; then
            echo "::error::GOOGLE_SERVICE_ACCOUNT_KEY secret is not set."
            exit 1
          fi
          printf '%s' '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}' > google-service-account.json
          node -e "JSON.parse(require('fs').readFileSync('google-service-account.json','utf8'))" \
            || { echo "::error::Service account key is not valid JSON."; exit 1; }

      - name: Submit to Play Store (internal track)
        if: |
          steps.gate.outputs.enabled == 'true' &&
          steps.profile.outputs.name == 'production' &&
          (github.event_name == 'push' || inputs.submit)
        run: |
          eas submit \
            --platform android \
            --profile production \
            --latest \
            --non-interactive

      - name: Remove service account key
        # always() so the key never survives a failed submission.
        if: always()
        run: rm -f google-service-account.json

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ steps.profile.outputs.name }} build"
            echo ""
            echo "Builds: https://expo.dev/accounts/hemanttyagi1001/projects/tyagis-home/builds"
            echo ""
            if [ "${{ steps.gate.outputs.enabled }}" = "true" ]; then
              echo "Submitted as a **draft** on the internal track - roll it out from the Play Console."
            else
              echo "**Play Store submission is off.** Google rejects API submissions until an app"
              echo "has had one manual upload, so:"
              echo ""
              echo "1. Download the AAB from the build page above."
              echo "2. Play Console -> Testing -> Internal testing -> upload it."
              echo "3. Enable automatic submission from then on:"
              echo '   `gh variable set PLAY_SUBMIT_ENABLED --body true`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
